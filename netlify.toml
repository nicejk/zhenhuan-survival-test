[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# /sb/* 由 netlify/functions/proxy.mjs 接管（函数路由优先于 SPA 回退）

# SPA 路由回退：刷新/直达子路径均返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 带 hash 的构建产物长期缓存，避免每次进页面重新下载 JS/CSS
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 入口 HTML 始终回源校验，保证发版后立即生效
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
