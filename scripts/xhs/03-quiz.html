<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1660px; }
  body {
    background:#14100e; color:#f7efe2; overflow:hidden; position:relative;
    font-family:"PingFang SC","Hiragino Sans GB","Songti SC",serif;
    background-image:
      radial-gradient(55% 40% at 50% 6%, rgba(139,30,30,.32), transparent 72%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.016) 0 1px, transparent 1px 6px);
  }
  .frame { position:absolute; inset:44px; border:1px solid rgba(201,162,76,.24); }

  .head { position:absolute; top:88px; left:96px; right:96px; text-align:center; z-index:3; }
  .eyebrow { font-size:18px; letter-spacing:12px; color:#c9a24c; }
  .title {
    margin-top:28px; font-family:"Songti SC",serif;
    font-size:78px; line-height:1.15; font-weight:600; letter-spacing:1px;
  }
  .title .hl { color:#e5cf9c; }
  .sub { margin-top:20px; font-size:23px; letter-spacing:1px; color:rgba(247,239,226,.6); }

  .shot {
    position:absolute; left:96px; top:340px; width:560px; z-index:2;
    border-radius:50px; overflow:hidden;
    border:1px solid rgba(201,162,76,.5);
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 8px rgba(201,162,76,.06);
  }
  .shot img { display:block; width:100%; height:auto; }

  .caption {
    position:absolute; left:98px; top:1576px; z-index:3;
    font-size:17px; letter-spacing:3px; color:rgba(247,239,226,.42);
  }

  .notes { position:absolute; left:700px; right:84px; top:356px; z-index:3; }
  .note { margin-bottom:38px; }
  .note .no {
    font-family:"Songti SC",serif; font-size:32px; color:#c9a24c; letter-spacing:2px;
  }
  .note b {
    display:block; margin-top:10px; font-size:30px; line-height:1.35; font-weight:600;
    color:#f7efe2; letter-spacing:1px;
  }
  .note p {
    margin-top:12px; font-size:19px; line-height:1.7; color:rgba(247,239,226,.58);
  }
  .rule { height:1px; background:linear-gradient(90deg, rgba(201,162,76,.45), transparent); margin-bottom:32px; }

  .closing {
    position:absolute; left:700px; right:84px; top:1408px; z-index:3;
    padding-left:24px; border-left:2px solid rgba(201,162,76,.4);
  }
  .closing p { font-size:21px; line-height:1.7; color:rgba(247,239,226,.55); }
  .closing p b { color:rgba(247,239,226,.8); font-weight:600; }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="head">
    <p class="eyebrow">真 实 答 题 页</p>
    <h1 class="title">25 道题，<span class="hl">一道一道</span>选</h1>
    <p class="sub">没有复杂的操作，打开就能开始</p>
  </div>

  <div class="shot">
    <img src="../../.screenshots/live-quiz.png" alt="answer page">
  </div>
  <p class="caption">· 以上为真实页面截图 ·</p>

  <div class="notes">
    <div class="note">
      <div class="no">01</div>
      <b>右上角一直显示<br>剩余次数与有效期</b>
      <p>不用自己记还剩几次，<br>也不用翻购买记录。</p>
    </div>
    <div class="rule"></div>
    <div class="note">
      <div class="no">02</div>
      <b>每道题都是具体的场面</b>
      <p>不是「你是否善于察言观色」这种形容词，<br>而是真遇上事时，你会怎么选。</p>
    </div>
    <div class="rule"></div>
    <div class="note">
      <div class="no">03</div>
      <b>四选一，凭第一反应</b>
      <p>别想哪个「更像正确答案」，<br>想哪个更像你自己。</p>
    </div>
    <div class="rule"></div>
    <div class="note">
      <div class="no">04</div>
      <b>25 题答完，直接出结果</b>
      <p>不用等人算分，也不用自己估。<br>选完最后一题就看到了。</p>
    </div>
  </div>

  <div class="closing">
    <p><b>六个维度交错出题</b><br>不是同一类连着问，避免顺着上一题思路走。</p>
  </div>
</body>
</html>
